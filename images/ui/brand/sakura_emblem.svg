<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-label="彼岸花仙境櫻花徽章">
  <defs>
    <linearGradient id="badge" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7df98"/>
      <stop offset="1" stop-color="#9d681b"/>
    </linearGradient>
    <linearGradient id="petal" x1="20" y1="15" x2="47" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#fff8fc"/>
      <stop offset=".52" stop-color="#ffd3e4"/>
      <stop offset="1" stop-color="#e78aad"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.5" flood-color="#5c222d" flood-opacity=".42"/>
    </filter>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="17" fill="url(#badge)" stroke="#f3d783" stroke-width="1.5"/>
  <g transform="translate(32 32)" filter="url(#shadow)">
    <ellipse cx="0" cy="-14" rx="9" ry="15" fill="url(#petal)"/>
    <ellipse cx="0" cy="-14" rx="9" ry="15" fill="url(#petal)" transform="rotate(72)"/>
    <ellipse cx="0" cy="-14" rx="9" ry="15" fill="url(#petal)" transform="rotate(144)"/>
    <ellipse cx="0" cy="-14" rx="9" ry="15" fill="url(#petal)" transform="rotate(216)"/>
    <ellipse cx="0" cy="-14" rx="9" ry="15" fill="url(#petal)" transform="rotate(288)"/>
    <circle r="7" fill="#f2b94b"/>
    <circle r="3.2" fill="#fff1b3"/>
  </g>
</svg>
