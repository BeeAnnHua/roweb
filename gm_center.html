<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <title>GM CENTER｜彼岸花仙境</title>
  <link rel="icon" type="image/svg+xml" href="images/ui/brand/sakura_emblem.svg?v=0.9.85C">
  <link rel="stylesheet" href="css/gm_center.css?v=0.9.85C">
</head>
<body>
  <main class="gm-shell">
    <header class="gm-header">
      <div class="gm-brand"><img src="images/ui/brand/sakura_emblem.svg?v=0.9.85C" alt=""><div><small>彼岸花仙境</small><h1>GM CENTER</h1></div></div>
      <div class="gm-account"><span id="gmIdentity">權限驗證中…</span><button id="backGameButton" type="button">返回遊戲</button></div>
    </header>

    <section id="gmDenied" class="gm-denied" hidden><h2>無 GM 權限</h2><p>目前登入的遊戲帳號沒有 GM CENTER 使用權限。</p><button type="button" onclick="location.href='index.html'">返回遊戲</button></section>

    <div id="gmWorkspace" class="gm-workspace" hidden>
      <section class="gm-panel gm-compose">
        <div class="gm-panel-title"><div><small>MAIL SERVICE</small><h2>寄送遊戲內郵件</h2></div><span id="gmStatus">就緒</span></div>
        <div class="gm-form-grid">
          <label>寄送對象
            <select id="targetMode">
              <option value="player">指定 Player ID</option>
              <option value="all">全服啟用帳號</option>
              <option value="all_normal">一般玩家</option>
              <option value="all_test">GM / 測試帳號</option>
            </select>
          </label>
          <label id="playerIdWrap">Player ID
            <div class="gm-inline"><input id="targetPlayerId" type="number" min="100001" step="1" placeholder="例如 100010"><button id="lookupPlayerButton" type="button">查詢</button></div>
          </label>
          <label>郵件標題<input id="mailSubject" maxlength="80" placeholder="最多 80 字"></label>
          <label>Zeny 附件<input id="mailZeny" type="number" min="0" max="999999999999" value="0"></label>
          <label>藍寶石附件<input id="mailBlueGem" type="number" min="0" max="999999999999" value="0"></label>
          <label>紅寶石附件<input id="mailRedGem" type="number" min="0" max="999999999999" value="0"></label>
        </div>
        <label class="gm-body-label">郵件內容<textarea id="mailBody" maxlength="4000" rows="7" placeholder="最多 4000 字"></textarea></label>

        <div class="gm-attachments-head"><div><b>道具附件</b><small>最多 5 種道具；輸入 Item ID 後會自動核對名稱。</small></div><button id="clearAttachments" type="button">清空附件</button></div>
        <div id="attachmentRows" class="gm-attachment-rows"></div>
        <datalist id="itemSuggestions"></datalist>

        <div class="gm-send-bar"><span id="recipientPreview">尚未選擇玩家</span><button id="sendMailButton" type="button">確認寄送</button></div>
      </section>

      <aside class="gm-side">
        <section class="gm-panel">
          <div class="gm-panel-title"><div><small>PLAYER LOOKUP</small><h2>玩家查詢</h2></div></div>
          <div class="gm-inline"><input id="playerSearch" type="search" placeholder="Player ID / 遊戲帳號"><button id="searchPlayerButton" type="button">搜尋</button></div>
          <div id="playerResults" class="gm-player-results"><div class="gm-empty">輸入條件查詢玩家。</div></div>
        </section>
        <section class="gm-panel">
          <div class="gm-panel-title"><div><small>AUDIT</small><h2>最近寄送</h2></div><button id="refreshHistoryButton" type="button">更新</button></div>
          <div id="mailHistory" class="gm-history"><div class="gm-empty">讀取中…</div></div>
        </section>
      </aside>
    </div>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/auth_storage_runtime.js?v=0.9.86C"></script>
  <script src="js/gm_center.js?v=0.9.86C"></script>
</body>
</html>
